[project]
name = "formpilot-backend"
version = "0.1.0"
description = "FormPilot API, passes and worker"
readme = "../README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.28,<0.29",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "N",             # naming
    "S",             # bandit (security)
    "ASYNC",         # async pitfalls
    "T20",           # no print: use the structured logger
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use fake secrets, and inspect the filesystem directly from async tests.
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast tests with no network, database or Redis (auto-applied under tests/unit)",
    "integration: needs Postgres and/or Redis (auto-applied under tests/integration)",
]
filterwarnings = [
    # Starlette 1.7 deprecates using httpx for its TestClient in favour of httpx2. We keep httpx
    # (no new dependency; see docs/decisions/phase-1.md, known issues) and hide only this exact
    # message from this exact class. Every other warning stays visible.
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning',
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
